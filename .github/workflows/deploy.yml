name: Test and Deploy

on:
  # Run tests on Pull Requests
  pull_request:
    branches:
      - main

  # Deploy after merge to main
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: agrisense_user
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: agrisense_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql://agrisense_user:testpassword@localhost:5432/agrisense_test
          SECRET_KEY: test-secret-key-for-ci
          WEATHERAPI_KEY: ${{ secrets.WEATHERAPI_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ENVIRONMENT: testing
          USE_MOCK_ML: "True"
        run: |
          cd backend
          python -m pytest -v

  deploy:
    runs-on: ubuntu-latest
    needs: test
    # Only deploy on push to main (after merge), not on PR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/agrisense
            git fetch origin main
            git reset --hard origin/main
            docker compose down
            docker compose up -d --build
            docker compose ps
