# ===================================
# AgriSense - Docker Compose Configuration
# ===================================

services:
  # ===================================
  # PostgreSQL Database
  # ===================================
  postgres:
    image: postgres:15-alpine
    container_name: agrisense-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agrisense_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-strongpassword}
      POSTGRES_DB: ${POSTGRES_DB:-agrisense}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - agrisense-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agrisense_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===================================
  # FastAPI Backend
  # ===================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agrisense-backend
    restart: unless-stopped
    environment:
      APP_NAME: AgriSense
      APP_VERSION: 1.0.0
      DEBUG: ${DEBUG:-False}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      HOST: 0.0.0.0
      PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-agrisense_user}:${POSTGRES_PASSWORD:-strongpassword}@postgres:5432/${POSTGRES_DB:-agrisense}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_DAYS: 7
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
      OPENMETEO_BASE_URL: https://api.open-meteo.com/v1
      DEFAULT_LATITUDE: 3.1390
      DEFAULT_LONGITUDE: 101.6869
      DEFAULT_LOCATION: Kuala Lumpur
      WEATHER_CACHE_DURATION: 1800
      USE_MOCK_ML: ${USE_MOCK_ML:-True}
      ML_SERVICE_URL: ${ML_SERVICE_URL:-http://ml-service:8001/predict}
      ML_SERVICE_TIMEOUT: 10
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_SIZE: 10485760
      ALLOWED_IMAGE_EXTENSIONS: '["jpg","jpeg","png"]'
      TEMP_HIGH_THRESHOLD: 32
      TEMP_LOW_THRESHOLD: 18
      HUMIDITY_HIGH_THRESHOLD: 85
      SOIL_MOISTURE_LOW_THRESHOLD: 0.2
      WIND_SPEED_HIGH_THRESHOLD: 50
      RAIN_HEAVY_THRESHOLD: 10
      PEST_CONFIDENCE_THRESHOLD: 0.80
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FILE: /app/logs/agrisense.log
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - agrisense-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===================================
  # Adminer - Database Management Tool
  # ===================================
  adminer:
    image: adminer:latest
    container_name: agrisense-adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - agrisense-network
    depends_on:
      - postgres
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha-dark

networks:
  agrisense-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
  logs_data:
    driver: local
