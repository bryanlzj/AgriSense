# ===================================
# AgriSense - Docker Compose Configuration
# ===================================
# This file defines all services needed to run AgriSense in production

services:
  # ===================================
  # PostgreSQL Database
  # ===================================
  postgres:
    image: postgres:15-alpine
    container_name: agrisense-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agrisense_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-strongpassword}
      POSTGRES_DB: ${POSTGRES_DB:-agrisense}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - agrisense-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agrisense_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===================================
  # FastAPI Backend
  # ===================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agrisense-backend
    restart: unless-stopped
    environment:
      # Application
      APP_NAME: AgriSense
      APP_VERSION: 1.0.0
      DEBUG: ${DEBUG:-False}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      
      # Server
      HOST: 0.0.0.0
      PORT: 8000
      
      # Database (PostgreSQL)
      DATABASE_URL: postgresql://${POSTGRES_USER:-agrisense_user}:${POSTGRES_PASSWORD:-strongpassword}@postgres:5432/${POSTGRES_DB:-agrisense}
      
      # Authentication
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_DAYS: 7

      # AI Service (OpenRouter)
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
      
      # Weather API (WeatherAPI.com)
      WEATHERAPI_KEY: ${WEATHERAPI_KEY}
      WEATHERAPI_BASE_URL: https://api.weatherapi.com/v1
      DEFAULT_LATITUDE: 3.1390
      DEFAULT_LONGITUDE: 101.6869
      DEFAULT_LOCATION: Kuala Lumpur
      WEATHER_CACHE_DURATION: 1800
      
      # ML Service
      USE_MOCK_ML: ${USE_MOCK_ML:-True}
      ML_SERVICE_URL: ${ML_SERVICE_URL:-http://ml-service:8001/predict}
      ML_SERVICE_TIMEOUT: 10
      
      # File Upload
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_SIZE: 10485760
      ALLOWED_IMAGE_EXTENSIONS: '["jpg","jpeg","png"]'
      
      # Alert Thresholds
      TEMP_HIGH_THRESHOLD: 32
      TEMP_LOW_THRESHOLD: 18
      HUMIDITY_HIGH_THRESHOLD: 85
      SOIL_MOISTURE_LOW_THRESHOLD: 30
      PEST_CONFIDENCE_THRESHOLD: 0.80
      
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FILE: /app/logs/agrisense.log
      
      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    
    ports:
      - "8000:8000"
    
    networks:
      - agrisense-network
    
    depends_on:
      postgres:
        condition: service_healthy
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===================================
  # Adminer - Database Management Tool
  # ===================================
  adminer:
    image: adminer:latest
    container_name: agrisense-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - agrisense-network
    depends_on:
      - postgres
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha-dark

  # ===================================
  # Redis (Optional - for caching)
  # ===================================
  # Uncomment if you want to use Redis for caching
  # redis:
  #   image: redis:7-alpine
  #   container_name: agrisense-redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   networks:
  #     - agrisense-network
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # ===================================
  # ML Service (Optional - when ML team delivers)
  # ===================================
  # Uncomment when you have a real ML model
  # ml-service:
  #   build:
  #     context: ./ml
  #     dockerfile: Dockerfile
  #   container_name: agrisense-ml
  #   restart: unless-stopped
  #   environment:
  #     MODEL_PATH: /app/models/pest_detection_model.h5
  #   volumes:
  #     - ml_models:/app/models
  #   ports:
  #     - "8001:8001"
  #   networks:
  #     - agrisense-network

# ===================================
# Networks
# ===================================
networks:
  agrisense-network:
    driver: bridge

# ===================================
# Volumes (Persistent Data)
# ===================================
volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
  logs_data:
    driver: local
  # redis_data:
  #   driver: local
  # ml_models:
  #   driver: local
